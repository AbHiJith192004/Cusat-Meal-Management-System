# DigitalOcean App Platform production spec.
# messconnect-db (PostgreSQL 16, db-s-1vcpu-2gb, blr1) must already exist --
# the database block below attaches to it by name, it does not create it.
# App creation must also supply the two secret values declared without values;
# they are generated at create time so production signing keys stay out of the
# repository and out of any transcript.
#
# The three components clone the public repository directly rather than going
# through DigitalOcean's GitHub integration. That integration exists to enable
# deploy-on-push, which this spec deliberately does not want, and it requires
# authorising a third-party OAuth app against the GitHub account. A public
# clone URL needs no such grant, so there is one less provider tie to undo
# when this moves to a VPS. Deploys are explicit:
#   doctl apps create-deployment <app-id>
name: messconnect
region: blr

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

envs:
  - key: APP_ENV
    scope: RUN_TIME
    value: production
  - key: ALLOW_TEST_MODE
    scope: RUN_TIME
    value: "false"
  # The PUBLIC hostname, not DATABASE_PRIVATE_URL. The private one was tried
  # first and both deployments died identically: the migrate job raised
  # asyncpg TimeoutError after ~60s reaching private-messconnect-db-*, at
  # step 7 of 13. A timeout rather than a refusal means the packets had
  # nowhere to go -- App Platform components do not sit in the database's
  # VPC (default-blr1), so that hostname does not route for them. Adding the
  # app as a database trusted source did not change it; the second failure
  # was byte-for-byte the first.
  #
  # The public host is not a downgrade here. The URL carries
  # sslmode=require, so the connection is TLS-encrypted end to end, and the
  # cluster's trusted sources now admit only app:8116d81b -- before that
  # rule was added the firewall was EMPTY, which for DO managed Postgres
  # means reachable from any address on the internet. The posture is
  # stricter than when the private URL was configured and failing.
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${messconnect-db.DATABASE_URL}
  - key: JWT_SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  - key: QR_SECRET_KEY
    scope: RUN_TIME
    type: SECRET

services:
  - name: web
    git:
      repo_clone_url: https://github.com/AbHiJith192004/Cusat-Meal-Management-System.git
      branch: main
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    envs:
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      # Connection budget against messconnect-db (db-s-1vcpu-2gb, 47 max):
      #   web    2 x (8 + 8) = 32
      #   migrate            =  4  (capped below; alembic needs one)
      #   daily-reconciliation= 4  (capped below; the script is serial)
      #   total              = 40, leaving 7 spare for psql and DO internals.
      # The jobs are capped explicitly because they do NOT inherit these
      # service-scoped values -- they would otherwise take config.py's 5 + 5
      # default each, putting the worst case at 52 and over the ceiling.
      # A local load test at 300 concurrent students (audit/tools/load.py,
      # single vCPU) held 0% error rate and cut P50 latency from 2.3s to ~0.8s
      # versus the old 1/5/5 config, which was queuing on the pool (max
      # latency sat right at DB_POOL_TIMEOUT's 10s). 8 + 8 keeps that
      # headroom; raising it needs a bigger database plan, not a bigger pool.
      - key: WEB_CONCURRENCY
        scope: RUN_TIME
        value: "2"
      - key: DB_POOL_SIZE
        scope: RUN_TIME
        value: "8"
      - key: DB_MAX_OVERFLOW
        scope: RUN_TIME
        value: "8"
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL}
      - key: TRUST_PROXY_HEADERS
        scope: RUN_TIME
        value: "true"
    health_check:
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
      http_path: /health
      port: 8080
    liveness_health_check:
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
      http_path: /health
      port: 8080
    termination:
      drain_seconds: 20
      grace_period_seconds: 45

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    git:
      repo_clone_url: https://github.com/AbHiJith192004/Cusat-Meal-Management-System.git
      branch: main
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DB_POOL_SIZE
        scope: RUN_TIME
        value: "2"
      - key: DB_MAX_OVERFLOW
        scope: RUN_TIME
        value: "2"
    run_command: alembic upgrade head

  - name: daily-reconciliation
    kind: SCHEDULED
    schedule:
      cron: "0 1 * * *"
      time_zone: Asia/Kolkata
    git:
      repo_clone_url: https://github.com/AbHiJith192004/Cusat-Meal-Management-System.git
      branch: main
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DB_POOL_SIZE
        scope: RUN_TIME
        value: "2"
      - key: DB_MAX_OVERFLOW
        scope: RUN_TIME
        value: "2"
    run_command: python -m scripts.run_fine_reconciliation

databases:
  - name: messconnect-db
    engine: PG
    version: "16"
    production: true
    cluster_name: messconnect-db
