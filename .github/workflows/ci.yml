name: Production checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: messconnect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d messconnect_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/messconnect_test
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/messconnect_test
      JWT_SECRET_KEY: ci-only-signing-key-never-use-in-production-123
      QR_SECRET_KEY: ci-only-separate-qr-key-never-use-in-production-456
      APP_ENV: production
      ALLOW_TEST_MODE: "false"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.lock pytest pytest-asyncio httpx
        working-directory: backend
      - run: alembic upgrade head && alembic check && pytest prod_tests -q
        working-directory: backend
      - run: npm ci && npm run lint && npm run build && npm audit --audit-level=moderate
        working-directory: frontend
      - run: docker build -t messconnect:ci .
