<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CUSAT MessConnect - Meal &amp; Dining Management</title>
    <meta name="description" content="The CUSAT hostel mess app: plan your meals, opt out before the 9 PM cutoff, show a signed dining pass, and see your monthly bill and fines in one place." />

    <!-- This is a private service for enrolled students and mess staff. There
         is nothing here for a search engine to index, and student screens
         should never surface in results, so crawling is refused both here and
         in /robots.txt. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Social preview, for when the sign-in link is shared in a hostel group -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CUSAT MessConnect" />
    <meta property="og:title" content="CUSAT MessConnect" />
    <meta property="og:description" content="The hostel mess, without the paperwork. Meal planning, a signed dining pass, and monthly bills for CUSAT hostel students." />
    <meta property="og:image" content="/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CUSAT MessConnect - the hostel mess, without the paperwork" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CUSAT MessConnect" />
    <meta name="twitter:description" content="The hostel mess, without the paperwork." />
    <meta name="twitter:image" content="/social-preview.png" />
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F47A35" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CUSAT Mess" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
